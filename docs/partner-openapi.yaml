  /events:
    get:
      operationId: listEvents
      tags:
      - Eventos
      summary: Listar eventos
      description: |-
        Devuelve los eventos de tu espacio, del más reciente al más antiguo. Con `archived=true` lista solo los archivados.

        **Permiso requerido:** `events:read`.

        **Límite:** 600 peticiones por minuto por credencial.
      x-required-scopes:
      - events:read
      x-rate-limit:
        requests: 600
        perSeconds: 60
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página, desde 1.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Elementos por página, de 1 a 100.
      - name: archived
        in: query
        required: false
        schema:
          pattern: ^(true|false)$
          type: string
        description: '`true` lista solo los eventos archivados.'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'

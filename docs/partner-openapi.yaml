components:
  securitySchemes:
    PartnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: lm_live_… / lm_test_…
      description: 'Clave de API en `Authorization: Bearer <clave>`.'
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternativa a `Authorization`.
  responses:
    BadRequest:
      description: 'Petición inválida: el cuerpo, un parámetro o un identificador no cumplen las reglas, o el recurso no está
        en un estado que permita la operación.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validacion:
              value:
                error:
                  code: VALIDATION_ERROR
                  message:
                  - El nombre debe tener al menos 3 caracteres
                  - La fecha debe ser válida
                timestamp: '2026-10-29T08:33:09.417Z'
                path: /v1/partner/events
    Unauthorized:
      description: Falta la credencial, es inválida, está revocada o caducada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            sin_credencial:
              value:
                error:
                  code: UNAUTHORIZED
                  message: 'Incluye la credencial en Authorization: Bearer <api-key>'
                timestamp: '2026-10-29T08:33:09.384Z'
                path: /v1/partner/events
    Forbidden:
      description: La credencial no tiene el permiso necesario, o el contrato no incluye la función o la suspendió.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            falta_permiso:
              value:
                error:
                  code: FORBIDDEN
                  message: 'Falta el permiso API: events:write'
                timestamp: '2026-10-29T08:33:09.382Z'
                path: /v1/partner/events
    NotFound:
      description: El recurso no existe o pertenece a otro espacio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            no_existe:
              value:
                error:
                  code: NOT_FOUND
                  message: Evento no encontrado
                timestamp: '2026-10-29T08:33:09.404Z'
                path: /v1/partner/events/00000000-0000-4000-8000-000000000000
    Conflict:
      description: Conflicto con una petición anterior o con el estado del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotency_key_reutilizada:
              value:
                error:
                  code: CONFLICT
                  message: Idempotency-Key ya fue utilizada con otra solicitud
                timestamp: '2026-10-29T08:33:06.247Z'
                path: /v1/partner/events
    TooManyRequests:
      description: Superaste el límite por minuto o una cuota mensual del contrato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cuota_mensual:
              value:
                error:
                  code: RATE_LIMITED
                  message: Cuota mensual de solicitudes API agotada
                timestamp: '2026-10-29T07:47:31.681Z'
                path: /v1/partner/events
    ServiceUnavailable:
      description: Un servicio interno no está disponible temporalmente. Reintenta con espera creciente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            reconocimiento_facial:
              value:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Face recognition service is not available
                timestamp: '2026-10-29T08:33:07.363Z'
                path: /v1/partner/events/ea74bc9e-2c05-5784-b7d0-c4dc36d9bf96/search/face
    Forbidden_EVENT_LIMIT_REACHED:
      description: La credencial no tiene el permiso necesario, o el contrato no incluye la función o la suspendió.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cupo_de_eventos:
              value:
                error:
                  code: EVENT_LIMIT_REACHED
                  message: Tu contrato incluye 2 eventos al año y ya has creado 2. Contacta con tu gestor para ampliar el
                    cupo.
                  details:
                    limit: 2
                    used: 2
                    resetsAt: '2027-10-28T08:33:05.734Z'
                timestamp: '2026-10-29T08:33:09.277Z'
                path: /v1/partner/events
    Forbidden_PHOTO_LIMIT_REACHED:

- name: Fotografías
  description: Consultar el estado de cada fotografía, corregir dorsales, aprobar o rechazar y reprocesar.
- name: Descargas
  description: 'Entregar archivos: enlaces temporales a los originales y descargas gratuitas con o sin patrocinador.'
- name: Operaciones masivas
  description: Revisar, procesar, borrar o pedir enlaces para hasta 100 fotografías a la vez.
- name: Búsqueda
  description: Encontrar fotografías de un corredor por dorsal o por selfie dentro de un evento.
- name: Colaboradores
  description: Invitar a fotógrafos a un evento, con su comisión y condiciones de derechos.
- name: Patrocinadores
  description: Crear patrocinadores y asignarlos a eventos para que su logo aparezca en las descargas gratuitas.
- name: Analítica y exportaciones
  description: Métricas del evento y exportaciones en CSV.
- name: Marca y dominio
  description: Datos de tu espacio, imagen de marca y dominio propio.
- name: Pedidos y liquidaciones
  description: 'Consultar los pedidos pagados en la tienda de LucilaMon, el desglose de cada venta y las liquidaciones de
    tu espacio. Solo lectura: los reembolsos los gestiona el equipo de LucilaMon.'
- name: Webhooks
  description: Registrar destinos, rotar secretos y revisar o reintentar entregas.
- name: Uso y cuotas
  description: Consumo del contrato frente a sus topes.
- name: Eventos de webhook
  description: Los 28 eventos que puedes recibir. Cada uno llega como `POST` a tu URL con el sobre `{ id, type, createdAt,
    data }`.
- name: Errores
  x-displayName: Errores
  description: |-
    Todas las respuestas de error tienen la misma forma (ver la introducción). Estos son los códigos:

    | Código | HTTP | Cuándo ocurre |
    |---|---|---|
    | `UNAUTHORIZED` | 401 | Falta la credencial, es inválida, está revocada o caducada, o es de prueba y el contrato ya está en producción. |
    | `FORBIDDEN` | 403 | La credencial no tiene el permiso necesario (el mensaje indica cuál), el contrato no incluye esa función o está suspendido o vencido. |
    | `VALIDATION_ERROR` | 400 | El cuerpo, los parámetros o un identificador no son válidos, o la operación no se puede hacer en el estado actual del recurso. |
    | `NOT_FOUND` | 404 | El recurso no existe o pertenece a otro espacio. Por seguridad no distinguimos los dos casos. |
    | `CONFLICT` | 409 | La `Idempotency-Key` ya se usó con otra petición, o la primera sigue en curso. |
    | `ALREADY_PROCESSED` | 409 | Se pidió reprocesar una fotografía que ya está procesada. |
    | `RATE_LIMITED` | 429 | Superaste el límite por minuto o la cuota mensual de peticiones o de búsquedas faciales. |
    | `PHOTO_LIMIT_REACHED` | 403 | La subida superaría el cupo anual de fotografías del contrato. `details` trae `limit`, `used`, `requested` y `resetsAt`. |
    | `EVENT_LIMIT_REACHED` | 403 | Crear el evento superaría el cupo anual de eventos del contrato. `details` trae `limit`, `used` y `resetsAt`. |
    | `SERVICE_UNAVAILABLE` | 503 | Un servicio interno no está disponible temporalmente (por ejemplo el reconocimiento facial). Reintenta con espera creciente. |
    | `INTERNAL_ERROR` | 500 | Fallo inesperado de nuestro lado. Si persiste, escríbenos con la hora UTC, la ruta y el prefijo de tu clave. |
- name: Permisos
  x-displayName: Permisos (scopes)
  description: |-
    Cada credencial lleva solo los permisos que le des. Algunos solo se pueden conceder si el contrato incluye la función.

    | Permiso | Qué permite | Operaciones |
    |---|---|---|
    | `events:analytics` | Consultar métricas de eventos. | 8 |
    | `events:contributors` | Invitar y revocar fotógrafos. | 3 |
    | `events:read` | Leer eventos y su galería. | 3 |
    | `events:sponsors` | Gestionar patrocinadores y asignarlos a eventos. | 7 |
    | `events:write` | Crear, editar, archivar y restaurar eventos; portada. | 7 |
    | `exports:read` | Exportaciones en CSV. | 3 |
    | `metrics:write` | Enviar métricas de audiencia de tu tienda propia. | 1 |
    | `orders:read` | Consultar pedidos, desglose de ventas y liquidaciones. | 3 |
    | `photos:bulk` | Operaciones masivas (se suma al permiso de la operación). | 4 |
    | `photos:delete` | Borrar fotografías. | 2 |
    | `photos:download` | Generar enlaces a originales y descargas gratuitas. | 3 |
    | `photos:process` | Reprocesar fotografías. | 2 |
    | `photos:read` | Consultar fotografías y lotes de carga. | 5 |
    | `photos:review` | Aprobar o rechazar fotografías y corregir dorsales. | 5 |
    | `photos:upload` | Crear lotes y firmar, confirmar y cerrar cargas. | 4 |
    | `search:bib` | Buscar por dorsal. | 1 |
    | `search:face` | Buscar por selfie. | 2 |
    | `webhooks:manage` | Registrar y administrar webhooks. | 7 |
    | `workspace:read` | Leer tu espacio y el consumo del contrato. | 2 |
    | `workspace:write` | Editar marca, imágenes y dominio. | 5 |

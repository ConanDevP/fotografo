# ═══════════════════════════════════════════════════════════════════════════════
# Docker Compose - Desarrollo Local
# ═══════════════════════════════════════════════════════════════════════════════
#
# NOTA: Para producción, usa Neon PostgreSQL en lugar de este contenedor.
# Ver docs/NEON_MIGRATION.md para instrucciones de migración.
#
# Uso:
#   docker-compose up -d          # Iniciar todos los servicios
#   docker-compose up -d redis    # Solo Redis (si usas Neon para PostgreSQL)
#
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Local (Opcional - usa Neon en producción)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - local-db  # Solo se inicia con: docker-compose --profile local-db up
    environment:
      POSTGRES_DB: fotografos_db
      POSTGRES_USER: fotografos_user
      POSTGRES_PASSWORD: fotografos_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotografos_user -d fotografos_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis (Siempre necesario para colas y caché)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # API Service (Desarrollo local con Docker)
  # ─────────────────────────────────────────────────────────────────────────────
  # NOTA: Para producción, despliega en Railway/Render/Fly.io
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    profiles:
      - full-stack  # Solo con: docker-compose --profile full-stack up
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      # Usa la variable de entorno del host (Neon) o fallback a local
      - DATABASE_URL=${DATABASE_URL:-postgresql://fotografos_user:fotografos_pass@postgres:5432/fotografos_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run start:dev

  # ─────────────────────────────────────────────────────────────────────────────
  # Worker Service (Procesamiento de fotos en background)
  # ─────────────────────────────────────────────────────────────────────────────
  worker:
    build: 
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    profiles:
      - full-stack  # Solo con: docker-compose --profile full-stack up
    environment:
      - NODE_ENV=development
      # Usa la variable de entorno del host (Neon) o fallback a local
      - DATABASE_URL=${DATABASE_URL:-postgresql://fotografos_user:fotografos_pass@postgres:5432/fotografos_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run start:worker

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local